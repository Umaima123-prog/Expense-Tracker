<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <!-- Makes the page scale correctly on phones -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Expense Tracker</title>
  <link rel="stylesheet" href="style.css" />
  <!-- No token? Go to the login page right away, before the page is drawn -->
  <script>
    if (!localStorage.getItem('token')) window.location.replace('login.html');
  </script>
</head>
<body>
  <main class="container">
    <header class="page-header">
      <h1>Expense Tracker</h1>
      <div class="header-right">
        <!-- Shown while any request is running -->
        <span id="loading" class="loading" hidden>Loading...</span>
        <!-- The logged-in user's email and the Logout button -->
        <span id="user-email" class="user-email"></span>
        <button type="button" id="logout-btn" class="btn btn-small">Logout</button>
      </div>
    </header>

    <!-- General error message (API down, too slow, etc.) -->
    <div id="error" class="alert alert-error" hidden></div>

    <!-- ===== Monthly summary ===== -->
    <section class="card">
      <div class="card-header">
        <h2>Monthly summary</h2>
        <label class="month-picker">
          Month
          <input type="month" id="month" />
        </label>
      </div>
      <p class="total">Total: <strong id="summary-total">0.00</strong></p>
      <ul id="summary-categories" class="category-list"></ul>
    </section>

    <!-- ===== Add / Edit form ===== -->
    <section class="card">
      <h2 id="form-title">Add expense</h2>

      <!-- Validation errors from the API are shown here -->
      <div id="form-errors" class="alert alert-error" hidden></div>

      <form id="expense-form" novalidate>
        <div class="form-grid">
          <label>
            Title
            <input type="text" id="title" placeholder="e.g. Lunch" />
          </label>
          <label>
            Amount
            <input type="number" id="amount" step="0.01" min="0" placeholder="0.00" />
          </label>
          <label>
            Category
            <select id="category">
              <option value="">-- choose --</option>
              <option value="Food">Food</option>
              <option value="Transport">Transport</option>
              <option value="Bills">Bills</option>
              <option value="Other">Other</option>
            </select>
          </label>
          <label>
            Date
            <input type="date" id="date" />
          </label>
        </div>
        <div class="form-actions">
          <button type="submit" id="submit-btn" class="btn btn-primary">Add</button>
          <button type="button" id="cancel-btn" class="btn" hidden>Cancel</button>
        </div>
      </form>
    </section>

    <!-- ===== Expense list ===== -->
    <section class="card">
      <h2>Expenses</h2>
      <div class="table-wrapper">
        <table>
          <thead>
            <tr>
              <th>Title</th>
              <th>Amount</th>
              <th>Category</th>
              <th>Date</th>
              <th>Actions</th>
            </tr>
          </thead>
          <tbody id="expense-rows"></tbody>
        </table>
      </div>
      <p id="empty" class="empty" hidden>No expenses yet. Add one above!</p>
    </section>
  </main>

  <!-- api.js first: it defines authFetch, getUser, clearLogin... used by app.js -->
  <script src="api.js"></script>
  <script src="app.js"></script>
</body>
</html>
